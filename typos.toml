[default.extend-identifiers]
# dbcop is the project name, not a typo of "debug" or similar
dbcop = "dbcop"
# ba is a SAT literal variable name (b-before-a), not a typo of "by" or "be"
ba = "ba"
# SQL statement names are pluralized in prose.
SELECTs = "SELECTs"
UPDATEs = "UPDATEs"
# Lexical prefix-index fixture, following abc.
abd = "abd"

[default.extend-words]
# SER is the standard abbreviation for Serializability in database literature
SER = "SER"
