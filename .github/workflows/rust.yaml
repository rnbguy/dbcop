name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: Build
        run: cargo build --verbose --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run bounded tests
        run: |
          cargo test --verbose --workspace --all-features -- \
            --skip complete_bounded_domain \
            --skip exhaustive_incremental_admission_matches_exact_tentative_histories
      - name: Check no-std
        run: cargo build -p dbcop_core --no-default-features
      - name: Check MSRV
        # MSRV per root Cargo.toml rust-version; toolchain installed explicitly
        # so this is a real gate, not a silent skip.
        run: |
          rustup toolchain install stable --profile minimal
          cargo test -p dbcop_core -- \
            --skip complete_bounded_domain \
            --skip exhaustive_incremental_admission_matches_exact_tentative_histories
      - name: E2E generate and verify
        run: |
          ./target/debug/dbcop generate --n-hist 5 --n-node 3 --n-var 4 --n-txn 3 --n-evt 3 --output-dir /tmp/dbcop-e2e
          histories=(/tmp/dbcop-e2e/*.json)
          test "${#histories[@]}" -eq 5
          ./target/debug/dbcop verify --input-dir /tmp/dbcop-e2e --consistency committed-read

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/rustfmt@v1
